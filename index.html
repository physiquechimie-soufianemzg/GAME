<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quintet 30 - لعبة 5 في صف الفورية</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
        body {
            background:linear-gradient(135deg,#e8e0d5 0%,#f5f0e6 50%,#e0d8cc 100%);
            color:#1a2332; height:100vh; overflow:hidden; display:flex; flex-direction:column;
        }

        /* ===== Header ===== */
        #header {
            background:linear-gradient(135deg,#1a2332 0%,#243447 100%);
            color:#fff; padding:8px 14px; display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 3px 15px rgba(0,0,0,0.2); z-index:10; flex-shrink:0;
            border-bottom:2px solid #f1c40f;
        }
        #logo { font-size:1.2rem; font-weight:700; color:#f1c40f; }
        #scores { display:flex; gap:15px; font-size:0.95rem; }
        .score-x { color:#5dade2; font-weight:700; } .score-o { color:#ec7063; font-weight:700; }
        .score-num { background:rgba(255,255,255,0.15); padding:2px 8px; border-radius:5px; margin-right:4px; }
        #turn-indicator {
            padding:4px 14px; border-radius:20px; font-weight:700; font-size:0.85rem;
            background:#27ae60; color:#fff; min-width:110px; text-align:center;
        }
        #turn-indicator.waiting { background:#e67e22; }

        /* ===== Control Bar ===== */
        #ctrl-bar {
            background:rgba(255,255,255,0.9); padding:8px 14px; display:flex; 
            justify-content:space-between; align-items:center; border-bottom:1px solid #ddd;
        }
        .btn-action {
            padding:6px 12px; background:#3498db; color:#fff; border:none; 
            border-radius:6px; cursor:pointer; font-weight:600; font-size:0.85rem;
        }
        .btn-action:hover { background:#2980b9; }

        /* ===== Game Area ===== */
        #game-area { flex:1; display:flex; overflow:hidden; position:relative; }
        #board-container { flex:1; overflow:auto; position:relative; background:#faf7f2; }
        #board { position:relative; }

        /* ===== Cells ===== */
        .cell {
            position:absolute; width:30px; height:30px;
            border:1px solid rgba(26,35,50,0.18);
            display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:700; cursor:pointer; user-select:none; background:#fff;
        }
        .cell:hover { background:rgba(52,152,219,0.1); }
        .cell.x { color:#3498db; background:#eaf4fc; }
        .cell.o { color:#e74c3c; background:#fdeaea]; }

        /* ===== Lobby Overlays ===== */
        #lobby {
            position:fixed; inset:0; background:rgba(26,35,50,0.95);
            display:flex; justify-content:center; align-items:center; z-index:200; padding:20px;
        }
        .lobby-box {
            background:#fff; padding:30px; border-radius:15px; max-width:400px; 
            width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }
        .lobby-box h2 { margin-bottom:15px; color:#1a2332; }
        .invite-link-box {
            background:#f8f9fa; border:1px dashed #3498db; padding:10px; 
            border-radius:8px; margin:15px 0; font-size:0.8rem; word-break:break-all; user-select:all;
        }

        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:100; }
        #modal-content { background:#fff; padding:25px; border-radius:15px; text-align:center; max-width:300px; width:100%; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="lobby-box" id="box-create">
            <h2>🎯 لعبة Quintet 30 الفورية</h2>
            <p style="color:#666; font-size:0.9rem; margin-bottom:15px;">العب مع صديقك مباشرة دون الحاجة لإنشاء حساب أو انتظار السيرفرات!</p>
            <button class="btn-action" id="btn-start-game" style="font-size:1.1rem; padding:10px 25px; width:100%;">🚀 بدء لعبة جديدة</button>
            <button class="btn-action" id="btn-vs-ai" style="font-size:1rem; padding:10px 25px; width:100%; margin-top:10px; background:#8e44ad;">🤖 اللعب ضد الذكاء الاصطناعي</button>
        </div>
        
        <div class="lobby-box hidden" id="box-invite">
            <h2>⏳ في انتظار صديقك...</h2>
            <p style="color:#555; font-size:0.85rem;">قم بنسخ الرابط بالأسفل وأرسله لصديقك ليدخل معك في نفس اللعبة فوراً:</p>
            <div class="invite-link-box" id="link-text">جاري توليد الرابط...</div>
            <button class="btn-action" id="btn-copy-link">📋 نسخ الرابط لإرساله</button>
        </div>
    </div>

    <div id="header">
        <div id="logo">🎯 Quintet 30</div>
        <div id="scores">
            <span class="score-x">X: <span id="score-x" class="score-num">0</span></span>
            <span class="score-o">O: <span id="score-o" class="score-num">0</span></span>
        </div>
        <div>
            <span id="turn-indicator"> دورك 🎯</span>
        </div>
    </div>

    <div id="ctrl-bar">
        <button class="btn-action" id="btn-reset">🔄 إعادة تعيين الجولة</button>
        <span style="font-size:0.85rem; color:#666;" id="role-text">نمط اللعب المباشر</span>
    </div>

    <div id="game-area">
        <div id="board-container">
            <div id="board"></div>
        </div>
    </div>

    <div id="modal">
        <div id="modal-content">
            <h2 id="modal-title">انتهت اللعبة!</h2>
            <p id="modal-body" style="margin:10px 0; font-weight:bold;"></p>
            <button class="btn-action" onclick="location.reload()">جولة جديدة</button>
        </div>
    </div>

    <script>
        const id = x => document.getElementById(x);
        const BOARD_SIZE = 30;
        let board = [];
        let curPlayer = 'X';
        let mySymbol = 'X'; 
        let scoreX = 0, scoreO = 0;
        let isAI = false;
        let gameActive = true;

        // إعداد شبكة اللعب
        function renderBoard() {
            const bEl = id('board'); bEl.innerHTML = '';
            bEl.style.width = (BOARD_SIZE * 30) + 'px';
            bEl.style.height = (BOARD_SIZE * 30) + 'px';
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.right = (c * 30) + 'px';
                    cell.style.top = (r * 30) + 'px';
                    cell.dataset.r = r; cell.dataset.c = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    bEl.appendChild(cell);
                }
            }
        }

        // قراءة بيانات اللعبة والتحكم المباشر عبر الرابط
        function syncFromURL() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('moves')) {
                renderBoard();
                const movesStr = params.get('moves');
                if(movesStr) {
                    const movesArr = movesStr.split('-');
                    curPlayer = 'X';
                    movesArr.forEach(m => {
                        if(!m) return;
                        const [r, c] = m.split(',').map(Number);
                        if(!isNaN(r) && !isNaN(c)) {
                            board[r][c] = curPlayer;
                            const cell = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
                            if (cell) { cell.textContent = curPlayer; cell.classList.add(curPlayer.toLowerCase()); }
                            curPlayer = curPlayer === 'X' ? 'O' : 'X';
                        }
                    });
                }
                
                // تحديد الأدوار تلقائياً بناءً على من فتح الرابط
                if (params.get('role') === 'join') {
                    mySymbol = 'O';
                    id('role-text').textContent = 'أنت تلعب بالرمز (O)';
                } else {
                    mySymbol = 'X';
                    id('role-text').textContent = 'أنت منشئ الغرفة (X)';
                }
                
                id('lobby').style.display = 'none';
                updateTurnUI();
            }
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c] !== null) return;
            if (!isAI && curPlayer !== mySymbol) { alert('⚠️ ليس دورك الآن! انتظر حركة الخصم المحدثة في الرابط.'); return; }

            board[r][c] = curPlayer;
            const cell = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
            if (cell) { cell.textContent = curPlayer; cell.classList.add(curPlayer.toLowerCase()); }

            // تحديث الرابط فوراً لمشاركته
            const params = new URLSearchParams(window.location.search);
            let moves = params.get('moves') || '';
            moves += (moves ? '-' : '') + `${r},${c}`;
            params.set('moves', moves);
            
            if (checkWin(r, c)) {
                id('modal-body').textContent = `الفائز هو اللاعب: ${curPlayer}`;
                id('modal').style.display = 'flex';
                gameActive = false;
                return;
            }

            curPlayer = curPlayer === 'X' ? 'O' : 'X';
            
            if (isAI) {
                updateTurnUI();
                if (curPlayer === 'O') setTimeout(executeAIMove, 300);
            } else {
                // في اللعب المشترك: نقوم بتحديث الرابط في المتصفح ونسخه تلقائياً للخصم
                params.set('role', 'join'); // الخصم سيكون الزائر دائماً
                const nextURL = window.location.origin + window.location.pathname + '?' + params.toString();
                window.history.replaceState({}, '', window.location.pathname + '?' + 'moves=' + moves + '&role=' + mySymbol.toLowerCase());
                
                navigator.clipboard.writeText(nextURL).then(() => {
                    alert('🎯 تم تسجيل حركتك بنجاح! وتم نسخ رابط اللعبة المحدث تلقائياً بحافظتك، أرسله لصديقك الآن ليكمل دوره!');
                }).catch(() => {
                    prompt('🎯 حركتك جاهزة! انسخ هذا الرابط المحدث وأرسله لصديقك فوراً ليكمل دوره:', nextURL);
                });
                updateTurnUI();
            }
        }

        function checkWin(r, c) {
            const sym = board[r][c];
            const dirs = [ [0,1], [1,0], [1,1], [1,-1] ];
            for (let [dr, dc] of dirs) {
                let count = 1;
                let nr = r + dr, nc = c + dc;
                while(nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc] === sym) { count++; nr+=dr; nc+=dc; }
                nr = r - dr; nc = c - dc;
                while(nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc] === sym) { count++; nr-=dr; nc-=dc; }
                if (count >= 5) return true;
            }
            return false;
        }

        function updateTurnUI() {
            const ti = id('turn-indicator');
            if (curPlayer === mySymbol) {
                ti.textContent = '🎯 دورك الآن'; ti.className = '';
            } else {
                ti.textContent = '⏳ دور الخصم'; ti.className = 'waiting';
            }
        }

        // أزرار التحكم واللوبي
        id('btn-start-game').addEventListener('click', () => {
            id('box-create').classList.add('hidden');
            id('box-invite').classList.remove('hidden');
            const startURL = window.location.origin + window.location.pathname + '?moves=&role=join';
            id('link-text').textContent = startURL;
        });

        id('btn-copy-link').addEventListener('click', () => {
            const link = id('link-text').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('📋 تم نسخ الرابط بنجاح! أرسله لصديقك الآن، وبمجرد أن يفتحه ستبدأ اللعبة فوراً.');
                window.location.href = window.location.origin + window.location.pathname + '?moves=&role=host';
            });
        });

        id('btn-vs-ai').addEventListener('click', () => {
            isAI = true; id('lobby').style.display = 'none';
            id('role-text').textContent = 'نمط اللعب ضد الذكاء الاصطناعي';
            renderBoard();
        });

        id('btn-reset').addEventListener('click', () => {
            const p = new URLSearchParams(window.location.search);
            p.delete('moves');
            window.location.href = window.location.origin + window.location.pathname;
        });

        function executeAIMove() {
            let options = [];
            for(let r=0; r<BOARD_SIZE; r++) {
                for(let c=0; c<BOARD_SIZE; c++) { if(board[r][c] === null) options.push({r,c}); }
            }
            if(options.length > 0 && gameActive) {
                let choice = options[Math.floor(Math.random() * options.length)];
                board[choice.r][choice.c] = 'O';
                const cell = document.querySelector(`.cell[data-r='${choice.r}'][data-c='${choice.c}']`);
                if (cell) { cell.textContent = 'O'; cell.classList.add('o'); }
                if (checkWin(choice.r, choice.c)) {
                    id('modal-body').textContent = 'للأسف، فاز الذكاء الاصطناعي!';
                    id('modal').style.display = 'flex'; gameActive = false; return;
                }
                curPlayer = 'X'; updateTurnUI();
            }
        }

        renderBoard();
        syncFromURL();
    </script>
</body>
</html>
